# AgentX CI — parallel-tasks 单测回归保护
# push 到 main / PR 时自动运行三个服务包的 typecheck + 单元测试。
# 覆盖：SDK conversation client（17 用例）、gateway chat-tasks（16 用例）、
#       conversation-service task-manager（11 用例）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (parallel-tasks client)
        run: npm test

  gateway:
    name: Gateway (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Install
        # npm 10.x crashes on this large dep tree ("Exit handler never called") — use npm 11
        run: npx --yes npm@11 ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (chat-tasks / P9 gate)
        run: npm test

  conversation-service:
    name: Conversation Service (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conversation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conversation-service/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (task-manager)
        run: npm test
