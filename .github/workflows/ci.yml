# AgentX CI — payments / SDK / gateway 构建与单测回归保护
# push 到 main / PR 时自动运行：
#   payments        通用支付引擎（build + 单测）——发布 @agentxv2/payments 前必须全绿
#   sdk             @agentxv2/sdk（typecheck + 单测 + build）——依赖已发布的
#                   @agentxv2/payments（^0.1.0，registry），不依赖 monorepo 目录
#   gateway         AgentX Gateway（typecheck + 单测 + build）——@agentxv2/payments
#                   为 file: 依赖，需先在 payments 目录 npm ci + build
#   conversation-service 并行任务服务（typecheck + 单测）
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payments:
    name: Payments (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: payments/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  sdk:
    name: SDK (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (tsup, publishable artifacts)
        run: npm run build

  gateway:
    name: Gateway (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Prepare @agentxv2/payments (file: dependency)
        working-directory: payments
        run: npm ci && npm run build
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  conversation-service:
    name: Conversation Service (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conversation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conversation-service/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
